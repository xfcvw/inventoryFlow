services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventoryflow_app
    working_dir: /var/www/html
    env_file: [.env]
    volumes: ["./:/var/www/html"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: inventoryflow_nginx
    ports: ["8080:80"]
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    container_name: inventoryflow_db
    environment:
      POSTGRES_DB: inventoryflow
      POSTGRES_USER: inventoryflow
      POSTGRES_PASSWORD: inventoryflow_dev_password
    ports: ["5432:5432"]
    volumes: ["inventoryflow_pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventoryflow -d inventoryflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: inventoryflow_mailpit
    ports: ["8025:8025"]
    restart: unless-stopped

volumes:
  inventoryflow_pgdata:
